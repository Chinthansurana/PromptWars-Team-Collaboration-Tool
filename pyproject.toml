[project]
name = "teamflow"
version = "1.0.0"
description = "AI-powered team collaboration platform built with Google Cloud services"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"

[tool.flake8]
max-line-length = 120
exclude = [".venv", "__pycache__", ".git"]
